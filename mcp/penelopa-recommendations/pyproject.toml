[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penelopa-recommendations-mcp"
version = "0.1.0"
description = "Local stdio MCP adapter for reading Penelopa.ai recommendations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "mcp>=2.1.1,<3.0.0",
  "pydantic>=2.7.0",
]

[project.scripts]
penelopa-recommendations-mcp = "penelopa_recommendations_mcp.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["penelopa_recommendations_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
